name: PinnacleStats
version: ${version}
main: io.github.mccreeper1318.pinnaclestats.PinnacleStatsPlugin
api-version: '1.21'
author: mccreeper1318
description: Exports formatted Minecraft player statistics for websites, dashboards, and integrations.
commands:
  pstats:
    description: Manage PinnacleStats cache, local exports, GitHub publishing, and optional API.
    usage: /pstats <status|reload|refresh|export|publish|debug>
    permission: pinnaclestats.admin
permissions:
  pinnaclestats.admin:
    description: Allows managing PinnacleStats.
    default: op

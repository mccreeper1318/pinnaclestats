name: Publish release artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version, build, and checksum
        id: release_files
        shell: bash
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          release_version="${release_tag#v}"
          project_version="$(./gradlew properties -q --no-daemon | sed -n 's/^version: //p')"

          if [[ "$project_version" != "$release_version" ]]; then
            echo "Release tag $release_tag does not match Gradle version $project_version." >&2
            exit 1
          fi

          ./gradlew clean build --no-daemon

          jar_path="$(find build/libs -maxdepth 1 -type f -name 'PinnacleStats-*.jar' ! -name '*-plain.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "No PinnacleStats release JAR was produced." >&2
            exit 1
          fi

          checksum_path="$jar_path.sha256"
          jar_directory="$(dirname "$jar_path")"
          jar_name="$(basename "$jar_path")"
          (cd "$jar_directory" && sha256sum "$jar_name") > "$checksum_path"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Attach JAR and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.release_files.outputs.jar_path }}" \
            "${{ steps.release_files.outputs.checksum_path }}" \
            --clobber

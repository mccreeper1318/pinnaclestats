name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Java 25 build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Verify plugin artifact
        run: bash scripts/verify-build-artifact.sh

      - name: Verify reproducible JAR
        shell: bash
        run: |
          set -euo pipefail
          first_jar="$(find build/libs -maxdepth 1 -type f -name 'PinnacleStats-*.jar' ! -name '*-plain.jar' -print -quit)"
          reference_jar="$RUNNER_TEMP/PinnacleStats-reference.jar"
          cp "$first_jar" "$reference_jar"

          ./gradlew clean jar --no-daemon

          rebuilt_jar="$(find build/libs -maxdepth 1 -type f -name 'PinnacleStats-*.jar' ! -name '*-plain.jar' -print -quit)"
          if ! cmp -s "$reference_jar" "$rebuilt_jar"; then
            echo "PinnacleStats JAR is not byte-for-byte reproducible from the same clean checkout." >&2
            sha256sum "$reference_jar" "$rebuilt_jar" >&2
            exit 1
          fi

          echo "Verified byte-for-byte reproducible JAR."

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: PinnacleStats-${{ github.sha }}
          path: build/libs/PinnacleStats-*.jar
          if-no-files-found: error

  release:
    name: Attach verified release artifact
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: PinnacleStats-${{ github.sha }}
          path: release-artifacts

      - name: Validate tag, checksum, and attach release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="${{ github.event.release.tag_name }}"
          release_version="${release_tag#v}"
          jar_path="$(find release-artifacts -maxdepth 1 -type f -name 'PinnacleStats-*.jar' ! -name '*-plain.jar' -print -quit)"

          if [[ -z "$jar_path" ]]; then
            echo "No verified PinnacleStats release JAR was downloaded." >&2
            exit 1
          fi

          expected_jar_name="PinnacleStats-${release_version}.jar"
          actual_jar_name="$(basename "$jar_path")"
          if [[ "$actual_jar_name" != "$expected_jar_name" ]]; then
            echo "Release tag $release_tag expects $expected_jar_name but the verified build produced $actual_jar_name." >&2
            exit 1
          fi

          checksum_path="$jar_path.sha256"
          jar_directory="$(dirname "$jar_path")"
          (cd "$jar_directory" && sha256sum "$actual_jar_name") > "$checksum_path"

          gh release upload "$release_tag" "$jar_path" "$checksum_path" --clobber
